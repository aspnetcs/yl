<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>添加条件</title>
		{% include 'system/common/header.html' %}
	</head>
	<body>
		 <div class="layui-container" style="margin-top: 30px;"> <!-- 添加一个容器，-->
			<div class="layui-row"> <!-- 添加栅格，8等分，左右偏移2-->
				<div class="layui-col-md8 layui-col-md-offset2">
					<form class="layui-form layui-form-pane">  <!-- 给容器追加 class="layui-form-pane"，即可显示为方框风格 -->
					
					  <!-- 隐藏域 -->
					  <input type="text" name="filter" id="filter" hidden>
					  <input type="text" name="id" id="id" hidden>
					  
					  <div class="layui-form-item">
					        <label class="layui-form-label">名称</label>
					        <div class="layui-input-block">
					          <input type="text" name="name" id="name" autocomplete="off" placeholder="名称" lay-verify="required" class="layui-input">
					        </div>
					  </div>
					  
					  <div class="layui-form-item">
					        <label class="layui-form-label">备注</label>
					        <div class="layui-input-block">
					          <textarea name="mark" id="mark" placeholder="备注" class="layui-textarea"></textarea>
					        </div>
					  </div>

					  <div class="layui-form-item" style="float: right;">
						<button class="pear-btn cancel-btn">取消</button>
						<button class="pear-btn layui-btn-primary" lay-submit lay-filter="editSave">确定</button>
					  </div>
					  
					</form>
					
				</div>
			</div>
		</div>
		
		{% include 'system/common/footer.html' %}
		<script>
			layui.use(function(){

				let $ = layui.$;
				let layer = layui.layer;
				let form = layui.form;

				
				//表单提交事件
				form.on("submit(editSave)",function(data){
					//获取表单提交的数据
					let field = data.field;
					console.log(field);
					
					//AJAX向后端发送请求
					$.ajax({
						type:"post",
						url:"/quantify/selection/editSave",
						data:JSON.stringify(field),
						contentType: 'application/json',
						dataType:"json",
						success:function(d){
							// console.log(d);
							if(d.status==0){
								//关闭弹出层
								let index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
								parent.layer.close(index); 
								layer.msg(d.msg);
							}else{
								//失败
								layer.msg(d.errors);
							}
						}
					});
					
					//阻止表单默认提交
					return false;
				});
				
				// 取消
				$('.cancel-btn').on('click', function(){  
				    // console.log('取消按钮被点击了');  
				    let index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
				    parent.layer.close(index); // 执行关闭
				  });  
			
			});
			
		</script>
			
		
	</body>
</html>
