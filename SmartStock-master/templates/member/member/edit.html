<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>编辑</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}"/>
	</head>
	<body>
		 <div class="layui-container" style="margin-top: 30px;"> <!-- 添加一个容器，-->
			<div class="layui-row"> <!-- 添加栅格，8等分，左右偏移2-->
				<div class="layui-col-md8 layui-col-md-offset2">
					<form class="layui-form"> 
					  
					  <!-- 隐藏域：member_id -->
					  <input type="hidden" name="id" id="id"/>
					  
					  <div class="layui-form-item">
					        <label class="layui-form-label">姓名</label>
					        <div class="layui-input-block">
					          <input type="text" name="last_name" id="last_name" disabled autocomplete="off" placeholder="姓名" lay-verify="required" class="layui-input">
					        </div>
					  </div>
					  
					  <div class="layui-form-item">
					        <label class="layui-form-label">手机号码</label>
					        <div class="layui-input-block">
					          <input type="text" name="mobile" id="mobile" disabled autocomplete="off" placeholder="手机号码" lay-verify="required" class="layui-input">
					        </div>
					  </div>
					  
					  <div class="layui-form-item" pane>
					    <label class="layui-form-label">状态</label>
					    <div class="layui-input-block" id="status"></div>
					  </div>
					  
					  <div class="layui-form-item">
					      <label class="layui-form-label">角色</label>
					      <div class="layui-input-block">
					          {% for role in roles %}
					              <input{% if role.id in checked_roles %}
					                  checked
					              {% endif %}
					                  value="{{ role.id }}" title="{{ role.name }}" type="checkbox"
					                  name="roleIds" lay-skin="primary">
					          {% endfor %}
					      </div>
					  </div>
					  
					  <div class="layui-form-item" style="float: right;">
						<button class="layui-btn layui-btn-primary cancel-btn">取消</button>
						<button class="layui-btn" lay-submit lay-filter="editSave">确定</button>
					  </div>
					  
					</form>
					
				</div>
			</div>
		</div>
		
		<script src="../../../static/layui/layui.js"></script>
		<script src="../../../static/layui_exts/xm-select.js"></script>
		<script>
			layui.use(function(){

				let $ = layui.$;
				let layer = layui.layer;
				let form = layui.form;
				
				//获取当前页面地址
				let url = location.href;
				// console.log(url);
				//截取参数
				let param = url.substring(url.lastIndexOf("?")+1,url.length);
				let ps = param.split("&");
				//截取参数
				let obj={};
				if(ps && ps.length>0){
					for(let i=0;i<ps.length;i++){
						let psList = ps[i].split("=");
						obj[psList[0].trim()]=psList[1].trim();
					}
				}
				// console.log(obj);
				
				//单选框回显
				let str='';
				if(obj.status==1){
					str+='<input type="radio" name="status" value="1" title="开启" checked>';
					str+='<input type="radio" name="status" value="0" title="关闭">';
				}else{
					str+='<input type="radio" name="status" value="1" title="开启">';
					str+='<input type="radio" name="status" value="0" title="关闭" checked>';
				}
				//将拼接好的单选框设置到指定位置
				$("#status").html(str);
				//重新渲染
				 form.render('radio');
				
				//表单提交事件
				form.on("submit(editSave)",function(data){
					//获取表单提交的数据
					let field = data.field;
					let roleIds = ''
					$('input[type=checkbox]:checked').each(function () {
					    roleIds += $(this).val() + ','
					})
					roleIds = roleIds.substr(0, roleIds.length - 1)
					field.roleIds = roleIds
					console.log(field);
					
					//AJAX向后端发送请求
					$.ajax({
						type:"post",
						url:"/member/member/editSave",
						data:JSON.stringify(field),
						contentType: 'application/json',
						dataType:"json",
						success:function(d){
							// console.log(d);
							if(d.status==0){
								//关闭弹出层
								let index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
								parent.layer.close(index); // 再执行关闭
								layer.msg(d.msg);
							}else{
								//失败
								layer.msg(d.errors);
							}
						}
					});
					
					//阻止表单默认提交
					return false;
				});
				
				// 取消
				$('.cancel-btn').on('click', function(){  
				    // console.log('取消按钮被点击了');  
				    let index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
				    parent.layer.close(index); // 执行关闭
					
					//阻止表单默认提交
					return false;
				  });  
				
				
				});

		</script>
			
		
	</body>
</html>
