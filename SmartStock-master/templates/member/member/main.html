<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<!-- 响应式布局 -->
		 <meta name="viewport" content="width=device-width, initial-scale=1">
		<title>会员管理</title>
		{% include 'system/common/header.html' %}
	</head>
	<body class="pear-container">
		
		<div class="layui-card">
			<div class="layui-card-body">
				<form class="layui-form" action="">
					<div class="layui-form-item">
						
						<label class="layui-form-label">工号</label>
						<div class="layui-input-inline">
						 <input type="text" name="id"  placeholder="工号" class="layui-input" lay-affix="clear">
						</div>
					  
						<label class="layui-form-label">姓名</label>
						<div class="layui-input-inline">
						 <input type="text" name="last_name"  placeholder="姓名" class="layui-input" lay-affix="clear">
						</div>

					<button class="layui-btn layui-bg-blue" lay-submit lay-filter="search">
						<i class="layui-icon layui-icon-search"></i>
						搜索
					</button>

				  </div>
				</form>
				
			</div>
		</div>
		
		<!-- 根据后端数据生成数据表格 -->
		<div class="layui-card">
		    <div class="layui-card-body">
		        <table class="layui-hide" id="member" lay-filter="member"></table>
		    </div>
		</div>
		
		<!-- 引入 layui.js -->
		{% include 'system/common/footer.html' %}

		<script>
			layui.use(function(){
				//获取table组件的对象
				let table = layui.table;
				let $ = layui.$;
				let layer = layui.layer;
				let form = layui.form;
				
				//搜索
				form.on('submit(search)', function(data){
				    let field = data.field; // 获得表单字段
					console.log(field);
				    // 执行搜索重载
				    table.reload('member', {
				      page: {
				        curr: 1 // 重新从第 1 页开始
				      },
				      where: field // 搜索的字段
				    });
				    return false; // 阻止默认 form 跳转
				});
				
				//头部工具栏事件
				table.on('toolbar(member)',function(obj){
					// console.log("顶部工具栏事件被触发了....",obj);
					
					let event = obj.event;
					
					if(event=='addBtn'){
						//添加事件
						layer.open({
							title:"添加",
							type: 2,  //2 iframe 内联框架层，可同时存在多个层
							content:'/member/member/add', 
							area:['500px','500px'],
							closeBtn:1,
							end: function(){
							    //刷新表格
								table.reload("member")
							}
						});
					
					}else if(event=='batchDel'){
						//批量删除事件
						let id = obj.config.id;
						let checkStatus = table.checkStatus(id);
						// console.log(checkStatus);
						//选中列表
						let list = checkStatus.data;
						// console.log(list);
						
						if(list && list.length==0){
							layer.msg("没有选择要删除的数据");
						}else{
							layer.confirm('确认是否删除',{btn:['确定','取消']},function(index){
								
								let arr = list.map(list => String(list.id)).join(',');
								// console.log(arr); // 输出: 10082,10081
								
								//AJAX
								$.ajax({
									type:"DELETE",
									url:"/member/member/delall?" + $.param({ memberId: arr }),
									dataType:"json",
									success:function(d){
										if(d.status==0){
											layer.msg(d.msg);
											//重新加载数据表格数据
											table.reload("member")
										}else{
											layer.msg(d.msg);
										}
									}
								});
								//关闭弹出层
								layer.close(index);
							});
						}
						
							
						}
					
					});
					
				
				//单元格事件处理
				table.on('tool(member)',function(obj){
					// console.log(obj); //前端打印obj
					let event = obj.event;
					if(event=='del'){
						layer.confirm('确定删除?',{btn:['确定','取消']},function(index){
							//点击确定
							//删除
							// 获取当前行id
							let memberId = obj.data.id;
							//AJAX调用,用let $ = layui.$引入jquery，调用删除接口，第一个参数是的接口地址，第二个参数是请求参数，第三个是回调函数
							$.getJSON("/member/member/del",{memberId:memberId},function(d){
								// console.log(d);
								if(d.status==0){
									//删除成功,表格数据刷新
									layer.msg(d.msg);
									table.reload("member")
								}else{
									layer.msg(d.msg);
								}
							});
							//关闭提示框
							layer.close(index);
						});
					}else if(event=='edit'){
						//更新
						layer.open({
							title:"编辑",
							type: 2,
							content:"/member/member/edit?status="+obj.data.status+"&id="+obj.data.id,
							area:['500px','500px'],
							closeBtn:1,
							end: function(){
							    //刷新表格
								table.reload("member")
							},
							success: function(layero, index, that){
							   //获取弹出层的JQuery对象
							   let body = layer.getChildFrame('body', index);
							   // console.log(obj.data);
							   // 给 iframe 页中的某个输入框赋值
							   body.find('#id').val(obj.data.id);
							   body.find('#last_name').val(obj.data.last_name);
							   body.find('#mobile').val(obj.data.mobile);
							   body.find('#status').val(obj.data.status);
							   body.find('#avatar').val(obj.data.avatar);
							   
							}
						});
					}
					
					
				});
				
				//调用对象中的函数进行表格生成
				table.render({
					elem:"#member",
					url:"/member/member/list",
					page: {
						limit:10,
						limits:[5,10,15,20],
						prev:"上一页",
						next:"下一页",
						groups:10,
						theme: '#1E9FFF'
					},
					skin: 'line',
					request: {
					  pageName: 'pageNo',
					  limitName: 'pageSize'
					},
					parseData: function(res){
						// console.log(res)
						return {
							"code": res.status, // 解析接口状态
							"msg": res.msg, // 解析提示文本
							"count": res.data.count, // 解析数据长度
							"data": res.data.rows // 解析数据列表
						}
					},
					toolbar:false,
					cols:[[
						{
							title:"工号",
							field:"id",
							align:"center",
						    style: 'font-size: 15px'
						},
						{
							title:"姓名",
							field:"last_name",
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"手机号码",
							field:"mobile",
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"事业部",
							field:"belong_unit_org_name",
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"一级部门",
							field:"dept_org_one",
							align:"center",
						    style: 'font-size: 15px'
						},
						{
							title:"二级部门",
							field:"dept_org_two",
							align:"center",
						    style: 'font-size: 15px'
						},
						{
							title:"三级部门",
							field:"org_name",
							align:"center",
						    style: 'font-size: 15px'
						},
						{
							title:"职位",
							field:"post_name",
							align:"center",
						    style: 'font-size: 15px'
						},
						{
							title:"状态",
							templet:function(d){
								return d.status==0?'<span class="layui-badge layui-bg-gray">无效</span>':'<span class="layui-badge layui-bg-blue">正常</span>'
							},
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"操作",
							templet:function(d){
								let s='<button type="button" lay-event="edit" class="layui-btn layui-btn-sm">编辑</button>'
								// s+='<button type="button" lay-event="del" class="layui-btn layui-btn-sm layui-bg-red">删除</button>';
								return s;
							},
							align:"center",
                            style: 'font-size: 15px'
						}
					]]
				});

			})
		</script>
			
		
		
	</body>
</html>
