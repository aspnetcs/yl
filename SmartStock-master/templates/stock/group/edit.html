<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>编辑</title>
		{% include 'system/common/header.html' %}
	</head>
	<body>
		 <div class="layui-container" style="margin-top: 30px;"> <!-- 添加一个容器，-->
			<div class="layui-row"> <!-- 添加栅格，8等分，左右偏移2-->
				<div class="layui-col-md8 layui-col-md-offset2">
					<form class="layui-form layui-form-pane">  <!-- 给容器追加 class="layui-form-pane"，即可显示为方框风格 -->
					  
					  <!-- 隐藏域：project_id -->
					  <input type="hidden" name="id" id="id"/>
					  
					  <div class="layui-form-item">
					        <label class="layui-form-label">分组名称</label>
					        <div class="layui-input-block">
					          <input type="text" name="name" id="name" autocomplete="off" placeholder="IP分组名称" lay-verify="required" class="layui-input">
					        </div>
					  </div>
					  
					  <div class="layui-form-item">
					        <label class="layui-form-label">父级分组</label>
					        <div class="layui-input-block">
							  <div name="project_id" id="project_id" class="xm-select-demo"></div>
					        </div>
					  </div>
					  
					  <div class="layui-form-item">
					        <label class="layui-form-label">分组类型</label>
					        <div class="layui-input-block">
					          <select lay-search="" name="stocks_type" lay-verify="required" id="stocks_type">
								  <option value="">请选择</option>
								  <option value="0">根目录</option>
								  <option value="1">股票</option>
								  <option value="2">基金</option>
							  </select>
					        </div>
					  </div>
					  
					  <div class="layui-form-item">
					        <label class="layui-form-label">分组描述</label>
					        <div class="layui-input-block">
					  			<textarea type="text" name="description" id="description" autocomplete="off" placeholder="分组描述" class="layui-textarea"></textarea>
					        </div>
					  </div>
					  
					  <div class="layui-form-item" pane>
					    <label class="layui-form-label">分组状态</label>
					    <div class="layui-input-block" id="flag"></div>
					  </div>
					  
					  <div class="layui-form-item" style="float: right;">
						<button class="pear-btn cancel-btn">取消</button>
						<button class="pear-btn pear-btn-primary" lay-submit lay-filter="editSave">确定</button>
					  </div>
					  
					</form>
					
				</div>
			</div>
		</div>
		
		{% include 'system/common/footer.html' %}
		<script src="../../../static/layui_exts/xm-select.js"></script>
		<script src="../../../static/layui_exts/customer/customer.js"></script>
		<script>
			layui.use(function(){

				let $ = layui.$;
				let layer = layui.layer;
				let form = layui.form;
				
				//获取当前页面地址参数
				let obj=getUrlParam();
				// console.log(obj);
				
				//单选框回显
				let str='';
				if(obj.flag==1){
					str+='<input type="radio" name="flag" value="1" title="开启" checked>';
					str+='<input type="radio" name="flag" value="0" title="关闭">';
				}else{
					str+='<input type="radio" name="flag" value="1" title="开启">';
					str+='<input type="radio" name="flag" value="0" title="关闭" checked>';
				}
				//将拼接好的单选框设置到指定位置
				$("#flag").html(str);
				//重新渲染
				 form.render('radio');
				 
				// 设置选择框的值
				document.getElementById('stocks_type').value = obj.stocks_type;
				form.render();
				
				//获取归属分组
				$.getJSON("/stock/group/belong_project",function(d){
					// console.log(d);
					if(d.status==0){
						
						//sm-select下拉框
						var demo2 = xmSelect.render({
							el: '#project_id', 
							model: { label: { type: 'text' } },
							tree: {
									show: true,
									strict: false,
									expandedKeys: true
								},
							prop: {
								name: 'title',
								value: 'id',
							},
							name: 'title',
							filterable: true,
							// radio: true, //单选
							theme: {
								color: '#00a0f0',
							},
							data: d.data,
							on: function(data){
									if(data.isAdd){
										return data.change.slice(0, 1)
									}
								}
						});
						
						//回显
						if (obj.parent_id===0){
							console.log(project_id);
							demo2.setValue('');
						}else{
							console.log(project_id);
							demo2.setValue([obj.parent_id]);
						}
						
					}else{
						layer.msg(d.msg)
					}
				});
				
				//表单提交事件
				form.on("submit(editSave)",function(data){
					//获取表单提交的数据
					let field = data.field;
					let project_id = xmSelect.get('#project_id', true).getValue('valueStr'); // 获取归属分组
					field.project_id = project_id; 
					console.log(field);
					
					//AJAX向后端发送请求
					$.ajax({
						type:"put",
						url:"/stock/group/editSave",
						data:JSON.stringify(field),
						contentType: 'application/json',
						dataType:"json",
						success:function(d){
							// console.log(d);
							if(d.status==0){
								//关闭弹出层
								let index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
								parent.layer.close(index); // 再执行关闭
								layer.msg(d.msg);
							}else{
								//失败
								layer.msg(d.errors);
							}
						}
					});
					
					//阻止表单默认提交
					return false;
				});
				
				// 取消
				$('.cancel-btn').on('click', function(){  
				    // console.log('取消按钮被点击了');  
				    let index = parent.layer.getFrameIndex(window.name); // 先得到当前 iframe 层的索引
				    parent.layer.close(index); // 执行关闭
					
					//阻止表单默认提交
					return false;
				  });  
			
				});

		</script>
			
		
	</body>
</html>
