<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<!-- 响应式布局 -->
		 <meta name="viewport" content="width=device-width, initial-scale=1">
		<title>分组列表</title>
		{% include 'system/common/header.html' %}
	</head>
	<body class="pear-container">
		
		<div class="layui-card">
			<div class="layui-card-body">
				<form class="layui-form" action="">
					<div class="layui-form-item">
					  
						<label class="layui-form-label">名称</label>
						<div class="layui-input-inline">
						 <input type="text" name="name"  placeholder="名称" class="layui-input" lay-affix="clear">
						</div>
		
					<button class="pear-btn pear-btn-primary" lay-submit lay-filter="search">
						<i class="layui-icon layui-icon-search"></i>
						搜索
					</button>
		
				  </div>
				</form>
				
			</div>
		</div>
		
		
		<!-- 根据后端数据生成数据表格 -->
		<div class="layui-card">
		    <div class="layui-card-body">
		        <table class="layui-hide" id="group" lay-filter="group"></table>
		    </div>
		</div>
		
		<!-- 引入 layui.js -->
		{% include 'system/common/footer.html' %}
		
		<script type="text/html" id="power-toolbar">
		        <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="addBtn">
		            <i class="layui-icon layui-icon-add-1"></i>
		            新增
		        </button>
		        <button class="pear-btn pear-btn-md" lay-event="batchDel">
		            <i class="layui-icon layui-icon-delete"></i>
		            删除
		        </button>
		</script>
		
		<script>
			layui.use(function(){
				//获取table组件的对象
				let table = layui.table;
				let $ = layui.$;
				let layer = layui.layer;
				let form = layui.form;
				
				//搜索
				form.on('submit(search)', function(data){
				    let field = data.field; // 获得表单字段
					console.log(field);
				    // 执行搜索重载
				    table.reload('group', {
				      page: {
				        curr: 1 // 重新从第 1 页开始
				      },
				      where: field // 搜索的字段
				    });
				    return false; // 阻止默认 form 跳转
				});
				
				//头部工具栏事件
				table.on('toolbar(group)',function(obj){
					// console.log("顶部工具栏事件被触发了....",obj);
					
					let event = obj.event;
					
					if(event=='addBtn'){
						//添加事件
						layer.open({
							title:"添加",
							type: 2,  //2 iframe 内联框架层，可同时存在多个层
							content:'/stock/group/add', 
							area:['500px','500px'],
							closeBtn:1,
							end: function(){
							    //刷新表格
								table.reload("group")
							}
						});
					
					}else if(event=='batchDel'){
						//批量删除事件
						let id = obj.config.id;
						let checkStatus = table.checkStatus(id);
						// console.log(checkStatus);
						//选中列表
						let list = checkStatus.data;
						// console.log(list);
						
						if(list && list.length==0){
							layer.msg("没有选择要删除的数据");
						}else{
							layer.confirm('确认是否删除',{btn:['确定','取消']},function(index){
								
								let arr = list.map(list => String(list.id)).join(',');
								// console.log(arr); // 输出: 10082,10081
								
								//AJAX
								$.ajax({
									type:"DELETE",
									url:"/stock/group/delall?" + $.param({ groupId: arr }),
									dataType:"json",
									success:function(d){
										if(d.status==0){
											layer.msg(d.msg);
											//重新加载数据表格数据
											table.reload("group")
										}else{
											layer.msg(d.msg);
										}
									}
								});
								//关闭弹出层
								layer.close(index);
							});
						}
						
							
						}
					
					});
					
				
				//单元格事件处理
				table.on('tool(group)',function(obj){
					// console.log(obj); //前端打印obj
					let event = obj.event;
					if(event=='del'){
						layer.confirm('确定删除?',{btn:['确定','取消']},function(index){
							// 获取当前行id
							let groupId = obj.data.id;
							//AJAX调用,用let $ = layui.$引入jquery，调用删除接口，第一个参数是的接口地址，第二个参数是请求参数，第三个是回调函数
							$.getJSON("/stock/group/del",{groupId:groupId},function(d){
								// console.log(d);
								if(d.status==0){
									//删除成功,表格数据刷新
									layer.msg(d.msg);
									table.reload("group")
								}else{
									layer.msg(d.msg);
								}
							});
							//关闭提示框
							layer.close(index);
						});
					}else if(event=='edit'){
						//更新
						layer.open({
							title:"编辑",
							type: 2,
							content:"/stock/group/edit?flag="+obj.data.flag+"&parent_id="+obj.data.parent_id+"&stocks_type="+obj.data.stocks_type,
							area:['500px','500px'],
							closeBtn:1,
							end: function(){
							    //刷新表格
								table.reload("group")
							},
							success: function(layero, index, that){
							   //获取弹出层的JQuery对象
							   let body = layer.getChildFrame('body', index);
							   // console.log(obj.data);
							   // 给 iframe 页中的某个输入框赋值
							   body.find('#id').val(obj.data.id);
							   body.find('#name').val(obj.data.name);
							   body.find('#description').val(obj.data.description);
							   body.find('#flag').val(obj.data.flag);
							   body.find('#parent_id').val(obj.data.parent_id);
							   body.find('#stocks_type').val(obj.data.stocks_type);
							}
						});
					}
					
					
				});
				
				//调用对象中的函数进行表格生成
				table.render({
					elem:"#group",
					url:"/stock/group/list",
					page: {
						limit:10,
						limits:[5,10,15,20],
						prev:"上一页",
						next:"下一页",
						groups:10
					},
					skin: 'line',
					request: {
					  pageName: 'pageNo',
					  limitName: 'pageSize'
					},
					parseData: function(res){
						// console.log(res)
						return {
							"code": res.status, // 解析接口状态
							"msg": res.msg, // 解析提示文本
							"count": res.data.count, // 解析数据长度
							"data": res.data.rows // 解析数据列表
						}
					},
					toolbar:`#power-toolbar`,
					cols:[[
						{type: 'checkbox', fixed: 'left'}, // 批量选择
						{
							title:"ID",
							field:"id",
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"分组名称",
							field:"name",
							sort:true  ,// 排序
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"分组描述",
							field:"description",
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"父级分组",
							field:"parent_name",
							align:"center",
						    style: 'font-size: 15px'
						},
						{
							title:"所属用户",
							field:"username",
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"状态",
							templet:function(d){
								return d.flag==0?'<span class="layui-badge layui-bg-gray">关闭</span>':'<span class="layui-badge layui-bg-blue">开启</span>'
							},
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"创建时间",
							field:"create_time",
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"操作",
							templet:function(d){
								let s='<button type="button" lay-event="edit" class="pear-btn pear-btn-sm pear-btn-primary">编辑</button>'
								s+='<button type="button" lay-event="del" class="pear-btn pear-btn-sm pear-btn-danger">删除</button>';
								return s;
							},
							align:"center",
                            style: 'font-size: 15px'
						}
					]]
				});

			})
		</script>
			
		
		
	</body>
</html>
