<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<!-- 响应式布局 -->
		 <meta name="viewport" content="width=device-width, initial-scale=1">
		<title>自选股</title>
		{% include 'system/common/header.html' %}
		<link rel="stylesheet" href="../../../static/layui_exts/customer/customer.css" />
	</head>
	<body class="pear-container">
		
		<div class="layui-card">
			<div class="layui-card-body">
				<form class="layui-form" action="">
					<div class="layui-form-item">
						
						<label class="layui-form-label">编码</label>
						<div class="layui-input-inline">
						 <input type="text" name="id"  placeholder="编码" class="layui-input" lay-affix="clear">
						</div>
					  
						<label class="layui-form-label">名称</label>
						<div class="layui-input-inline">
						 <input type="text" name="name"  placeholder="名称" class="layui-input" lay-affix="clear">
						</div>
						
						<label class="layui-form-label">是否持仓</label>
						<div class="layui-input-inline">
							 <select name="isHold">
							   <option value="1">是</option>
							   <option value="0">否</option>
							   <option value="" selected></option>
							 </select>
						</div>

					<button class="layui-btn layui-bg-blue" lay-submit lay-filter="search">
						<i class="layui-icon layui-icon-search"></i>
						搜索
					</button>

				  </div>
				</form>
				
			</div>
		</div>
		
		<!-- 根据后端数据生成数据表格 -->
		<div class="layui-card">
		    <div class="layui-card-body">
		        <table class="layui-hide layui-table-cell" id="selected" lay-filter="selected"></table>
		    </div>
		</div>
		

		<label id="updateTime" style="text-align: left; display: block; width: 100%; color: gray;">股票数据更新时间：{{updateTime}}</label>

		<!-- 引入 layui.js -->
		{% include 'system/common/footer.html' %}
		
		<script type="text/html" id="power-toolbar">
		        <button class="pear-btn pear-btn-md" lay-event="batchDel">
		            <i class="layui-icon layui-icon-delete"></i>
		            删除
		        </button>
		</script>
		
		<script>
			layui.use(function(){
				//获取table组件的对象
				let table = layui.table;
				let $ = layui.$;
				let layer = layui.layer;
				let form = layui.form;
				
				//搜索
				form.on('submit(search)', function(data){
				    let field = data.field; // 获得表单字段
					console.log(field);
				    // 执行搜索重载
				    table.reload('selected', {
				      page: {
				        curr: 1 // 重新从第 1 页开始
				      },
				      where: field // 搜索的字段
				    });
				    return false; // 阻止默认 form 跳转
				});
				
				//头部工具栏事件
				table.on('toolbar(selected)',function(obj){
					// console.log("顶部工具栏事件被触发了....",obj);
					
					let event = obj.event;
					
					if(event=='addBtn'){
						//添加事件
						layer.open({
							title:"添加",
							type: 2,  //2 iframe 内联框架层，可同时存在多个层
							content:'/stock/selected/add', 
							area:['500px','500px'],
							closeBtn:1,
							end: function(){
							    //刷新表格
								table.reload("selected")
							}
						});
					
					}else if(event=='batchDel'){
						//批量删除事件
						let id = obj.config.id;
						let checkStatus = table.checkStatus(id);
						// console.log(checkStatus);
						//选中列表
						let list = checkStatus.data;
						// console.log(list);
						
						if(list && list.length==0){
							layer.msg("没有选择要删除的数据");
						}else{
							layer.confirm('确认是否删除',{btn:['确定','取消']},function(index){
								
								let arr = list.map(list => String(list.id)).join(',');
								// console.log(arr); // 输出: 10082,10081
								
								//AJAX
								$.ajax({
									type:"DELETE",
									url:"/stock/selected/delAll?" + $.param({ selectedId: arr }),
									dataType:"json",
									success:function(d){
										if(d.status==0){
											layer.msg(d.msg);
											//重新加载数据表格数据
											table.reload("selected")
										}else{
											layer.msg(d.msg);
										}
									}
								});
								//关闭弹出层
								layer.close(index);
							});
						}
						
							
						}
					
					});
					
				
				//单元格事件处理
				table.on('tool(selected)',function(obj){
					// console.log(obj); //前端打印obj
					let event = obj.event;
					if(event=='del'){
						layer.confirm('确定删除?',{btn:['确定','取消']},function(index){
							//点击确定
							//删除
							// 获取当前行id
							let selectedId = obj.data.id;
							//AJAX调用,用let $ = layui.$引入jquery，调用删除接口，第一个参数是的接口地址，第二个参数是请求参数，第三个是回调函数
							$.getJSON("/stock/selected/del",{selectedId:selectedId},function(d){
								// console.log(d);
								if(d.status==0){
									//删除成功,表格数据刷新
									layer.msg(d.msg);
									table.reload("selected")
								}else{
									layer.msg(d.msg);
								}
							});
							//关闭提示框
							layer.close(index);
						});
					}else if(event=='edit'){
						//更新
						layer.open({
							title:"编辑",
							type: 2,
							content:"/stock/selected/edit?is_hold="+obj.data.is_hold+"&stock_type="+obj.data.stock_type+"&group_id="+obj.data.group_id+"&is_news="+obj.data.is_news,
							area:['500px','680px'],
							closeBtn:1,
							end: function(){
							    //刷新表格
								table.reload("selected")
							},
							success: function(layero, index, that){
							   //获取弹出层的JQuery对象
							   let body = layer.getChildFrame('body', index);
							   // console.log(obj.data);
							   // 给 iframe 页中的某个输入框赋值
							   body.find('#id').val(obj.data.id);
							   body.find('#code').val(obj.data.code);
							   body.find('#name').val(obj.data.name);
							   body.find('#group_id').val(obj.data.group_id);
							   body.find('#is_hold').val(obj.data.is_hold);
							   body.find('#stock_type').val(obj.data.stock_type);
							   body.find('#cost_price').val(obj.data.cost_price);
							   body.find('#hold_number').val(obj.data.hold_number);
							   body.find('#total_invest_budget').val(obj.data.total_invest_budget);
							   body.find('#income_rate_target').val(obj.data.income_rate_target);
							}
						});
					}else if(event=='strategy'){
						//更新
						layer.open({
							title:"添加策略",
							type: 2,
							content:"/stock/selected/strategy",
							area:['500px','600px'],
							closeBtn:1,
							end: function(){
							    //刷新表格
								table.reload("selected")
							},
							success: function(layero, index, that){
							   //获取弹出层的JQuery对象
							   let body = layer.getChildFrame('body', index);
							   // console.log(obj.data);
							   // 给 iframe 页中的某个输入框赋值
							   body.find('#id').val(obj.data.id);
							   body.find('#code').val(obj.data.code);
							   body.find('#name').val(obj.data.name);
							   body.find('#total_invest_budget').val(obj.data.total_invest_budget);
							   body.find('#income_rate_target').val(obj.data.income_rate_target);
							}
						});
					}else if(event=='trading'){
						//更新
						layer.open({
							title:"添加交易明细",
							type: 2,
							content:"/stock/selected/trading",
							area:['550px','600px'],
							closeBtn:1,
							end: function(){
							    //刷新表格
								table.reload("selected")
							},
							success: function(layero, index, that){
							   //获取弹出层的JQuery对象
							   let body = layer.getChildFrame('body', index);
							   // console.log(obj.data);
							   // 给 iframe 页中的某个输入框赋值
							   body.find('#id').val(obj.data.id);
							   body.find('#code').val(obj.data.code);
							   body.find('#name').val(obj.data.name);
							}
						});
					}
					
					
				});
				
				//调用对象中的函数进行表格生成
				table.render({
					elem:"#selected",
					url:"/stock/selected/list",
					page: {
						limit:10,
						limits:[5,10,15,20],
						prev:"上一页",
						next:"下一页",
						groups:10,
						theme: '#1E9FFF'
					},
					skin: 'line',
					request: {
					  pageName: 'pageNo',
					  limitName: 'pageSize'
					},
					parseData: function(res){
						// console.log(res)
						return {
							"code": res.status, // 解析接口状态
							"msg": res.msg, // 解析提示文本
							"count": res.data.count, // 解析数据长度
							"data": res.data.rows // 解析数据列表
						}
					},
					toolbar:false,
					totalRow: true,
					totalMethod: 'sum',
					cols:[[
						// {type: 'checkbox', fixed: 'left'},
						{
							title:"编码",
							field:"code",
							align:"center",
						    style: 'font-size: 15px',
							totalRowText: '合计：'
						},
						{
							title:"名称",
							field:"name",
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"最新价",
							field:"zxj",
							align:"center",
                            style: 'font-size: 15px',
						},
						{
						    title: "涨跌幅",
						    templet: function(d) {
						        // 定义涨跌幅的背景颜色样式
						        let chgStyle = '';
								let value = ''
								let value_percent = ''
						        if (d.zde > 0) {
									value = '+' + d.zde
									value_percent = '+' + d.zdf
						            chgStyle = 'style="color: red; font-size: 15px; font-weight: bold;"'; // 红色背景，白色文字以提高可读性
						        } else if (d.zde < 0) {
									value = d.zde
									value_percent = d.zdf
						            chgStyle = 'style="color: green; font-size: 15px; font-weight: bold;"'; // 绿色背景，白色文字
						        } else {
									value = d.zde
									value_percent = d.zdf
						            chgStyle = 'style="font-size: 15px; font-weight: bold;"'; // 无背景色
						        }
						        // 拼接涨跌幅和涨跌幅百分比的值
						        let chgDisplay = '<div ' + chgStyle + '>' + value + '(' + value_percent + '%)</div>';
						        // 返回合并后的HTML内容
						        return chgDisplay
						    },
						    align: "center",
						},
						{
						    title: "年初至今",
						    templet: function(d) {
						        // 定义涨跌幅的背景颜色样式
						        let chgStyle = '';
								let value = ''
								let value_percent = ''
						        if (d.zdf_nzj > 0) {
									value = '+' + d.zdf_nzj
						            chgStyle = 'style="color: red; font-size: 15px; font-weight: bold;"'; // 红色背景，白色文字以提高可读性
						        } else if (d.zdf_nzj < 0) {
									value = d.zdf_nzj
						            chgStyle = 'style="color: green; font-size: 15px; font-weight: bold;"'; // 绿色背景，白色文字
						        } else {
									value = d.zdf_nzj
						            chgStyle = 'style="font-size: 15px; font-weight: bold;"'; // 无背景色
						        }
						        // 拼接涨跌幅和涨跌幅百分比的值
						        let chgDisplay = '<div ' + chgStyle + '>' + value + '%</div>';
						        // 返回合并后的HTML内容
						        return chgDisplay
						    },
						    align: "center",
						},
						{
							title:"投资预算",
							field:"total_invest_budget",
							align:"center",
						    style: 'font-size: 15px',
							totalRow:true,
						},
						{
							title:"目标收益率",
							templet:function(d){
								return d.income_rate_target * 100 + '%'
							},
							align:"center",
						    style: 'font-size: 15px'
						},
						{
							title:"目标收益率",
							field:"income_rate_target",
							align:"center",
						    style: 'font-size: 15px',
							hide:true
						},
						{
							title:"目标收益",
							field:"income_target",
							align:"center",
						    style: 'font-size: 15px',
							totalRow:true,
						},
						{
							title:"是否持仓",
							templet:function(d){
								return d.is_hold==0?'<span class="layui-badge layui-bg-gray">否</span>':'<span class="layui-badge layui-bg-blue">是</span>'
							},
							align:"center",
                            style: 'font-size: 15px'
						},
						{
							title:"关注新闻",
							field:"is_news",
							align:"center",
						    style: 'font-size: 15px',
							hide:true
						},
						{
							title:"持仓价",
							field:"cost_price",
							align:"center",
						    style: 'font-size: 15px'
						},
						{
							title:"持仓股数",
							field:"hold_number",
							align:"center",
						    style: 'font-size: 15px'
						},
						{
							title:"成本市值",
							field:"cost_amt",
							align:"center",
						    style: 'font-size: 15px',
							totalRow:true
						},
						{
							title:"当前市值",
							field:"now_value",
							align:"center",
						    style: 'font-size: 15px',
							totalRow:true
						},
						{
							title:"持仓盈亏",
							field:"profit",
							templet:function(d){
								if (d.profit>0){
									result = '<div style="color: red; font-size: 15px; font-weight: bold;">' + d.profit + '</div>'
								}else if (d.profit<0){
									result = '<div style="color: green; font-size: 15px; font-weight: bold;">' + d.profit + '</div>'
								}else{
									result = d.profit
								}
								return result
							},
							align:"center",
						    style: 'font-size: 15px',
							totalRow:true,
						},
						{
							title:"收益率",
							templet:function(d){
								if (d.hold_number == 0){
									return 0
								}else{
									let profit_rate = Math.round(((d.zxj-d.cost_price)/d.cost_price)*100,2) 

									if (!isFinite(profit_rate)){
										profit_result = '0%'
									}else if(profit_rate>0){
										profit_result = '<div style="color: red; font-size: 15px; font-weight: bold;">' + profit_rate + '%</div>'
									}else if (profit_rate<0){
										profit_result = '<div style="color: green; font-size: 15px; font-weight: bold;">' + profit_rate + '%</div>'
									}else{
										profit_result = '0%'
									}
									return profit_result
								}
							},
							align:"center",
						    style: 'font-size: 15px',
							// totalRow:true,
						},
						{
							title:"操作",
							templet:function(d){
								let s='<button type="button" lay-event="edit" class="pear-btn pear-btn-sm pear-btn-primary">编辑</button>'
								s+='<button type="button" lay-event="strategy" class="pear-btn pear-btn-sm pear-btn-success">策略</button>';
								s+='<button type="button" lay-event="trading" class="pear-btn pear-btn-sm pear-btn-warming">交易</button>';
								s+='<button type="button" lay-event="del" class="pear-btn pear-btn-sm pear-btn-danger">删除</button>';
								return s;
							},
							align:"center",
                            style: 'font-size: 15px',
							width:250,
							fixed: 'right'
						}
					]],
					done: function (res, curr, count){ // 数据渲染完的回调函数，可以在这里操作DOM添加样式
					    //小计取整数
					    var divArr = $(".layui-table-total div.layui-table-cell"); 
						$.each(divArr, function (index, item) {
					        var _div = $(item);
					        var content = _div.html();
					        content = content.replace(".00", "");
							_div.html(content);
					    });
						
						var totalRow = document.querySelector('.layui-table-total'); // 获取合计行元素
						if(totalRow) {
						totalRow.style.backgroundColor = '#676767'; // 设置背景颜色
						totalRow.style.fontWeight = 'bold'; // 设置字体加粗
						}


					}

				});

			})
		</script>
			
		
		
	</body>
</html>
